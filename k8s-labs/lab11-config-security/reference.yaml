apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
data:
  MODE: blue
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-reader
rules:
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-reader
subjects:
- kind: ServiceAccount
  name: reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-reader
---
apiVersion: v1
kind: Pod
metadata:
  name: config-reader
spec:
  serviceAccountName: reader
  automountServiceAccountToken: false
  containers:
  - name: app
    image: busybox:1.36
    command: [sh, -c, 'echo env=$MODE; sleep 3600']
    envFrom:
    - configMapRef:
        name: settings
    resources:
      requests: {cpu: 50m, memory: 32Mi}
      limits: {cpu: 200m, memory: 64Mi}
    volumeMounts:
    - name: config
      mountPath: /config
      readOnly: true
  volumes:
  - name: config
    configMap:
      name: settings
