apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 4
  revisionHistoryLimit: 5          # 保留最近 5 个版本，供回滚
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                  # 更新过程中最多多出 1 个 Pod（先加后减）
      maxUnavailable: 0            # 更新过程中不允许少于期望副本数（保证容量不掉）
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web                   # 注意：Service 靠这个 label 找后端（Lab 07 的坑伏笔）
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
        env:
        - name: RELEASE
          value: "v1"              # 用环境变量标记版本，观察滚动更新
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits:   {cpu: 200m, memory: 64Mi}
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 3
