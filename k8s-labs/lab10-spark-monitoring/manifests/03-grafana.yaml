apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.5.1
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"              # 实验环境，生产走 SSO/Secret
        ports: [{containerPort: 3000}]
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits:   {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: {app: grafana}
  ports: [{port: 3000}]
