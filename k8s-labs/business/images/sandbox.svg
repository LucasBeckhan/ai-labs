<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="740" viewBox="0 0 1040 740">
<rect width="1040" height="740" fill="#f1f5f9"/>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style>
<text x="520" y="42" text-anchor="middle" font-size="26" fill="#0f172a">K8s云网安实战沙箱：部署、故障与恢复</text>
<rect x="50" y="70" width="940" height="75" rx="12" fill="white" stroke="#60a5fa" stroke-width="2"/>
<text x="520" y="99" text-anchor="middle" font-size="22" fill="#1d4ed8">虚构业务输入</text>
<text x="520" y="126" text-anchor="middle" font-size="18" fill="#334155">demo-a线路、告警事件与蓝/绿配置</text>
<path d="M520 146 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="50" y="170" width="940" height="75" rx="12" fill="white" stroke="#60a5fa" stroke-width="2"/>
<text x="520" y="199" text-anchor="middle" font-size="22" fill="#1d4ed8">ConfigMap：代码 / 配置 / 数据</text>
<text x="520" y="226" text-anchor="middle" font-size="18" fill="#334155">代码可复用；部署、探针、挂载与资源配置需要手写</text>
<path d="M520 246 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="50" y="270" width="940" height="75" rx="12" fill="white" stroke="#60a5fa" stroke-width="2"/>
<text x="520" y="299" text-anchor="middle" font-size="22" fill="#1d4ed8">Deployment：2个监控API副本</text>
<text x="520" y="326" text-anchor="middle" font-size="18" fill="#334155">启动探针 → 就绪检查 → Service:80 → 容器:8000</text>
<path d="M520 346 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="50" y="370" width="940" height="75" rx="12" fill="white" stroke="#60a5fa" stroke-width="2"/>
<text x="520" y="399" text-anchor="middle" font-size="22" fill="#1d4ed8">业务请求与诊断</text>
<text x="520" y="426" text-anchor="middle" font-size="18" fill="#334155">查线路 / 告警统计 / 指标；按Pod、Service、Events逐层定位</text>
<path d="M520 446 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="50" y="470" width="940" height="75" rx="12" fill="white" stroke="#60a5fa" stroke-width="2"/>
<text x="520" y="499" text-anchor="middle" font-size="22" fill="#1d4ed8">Job / 暂停的CronJob → PVC</text>
<text x="520" y="526" text-anchor="middle" font-size="18" fill="#334155">模拟安全周报：原始3条、去重2条；只归档，不发送</text>
<path d="M520 546 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="50" y="570" width="940" height="75" rx="12" fill="white" stroke="#60a5fa" stroke-width="2"/>
<text x="520" y="599" text-anchor="middle" font-size="22" fill="#1d4ed8">恢复与验收</text>
<text x="520" y="626" text-anchor="middle" font-size="18" fill="#334155">备份到Mac → 新PVC恢复 → 比对数字与hash；保留故障证据</text>
<text x="520" y="705" text-anchor="middle" font-size="17" fill="#475569">全部为模拟数据；HTTP服务与批任务是两条工作负载链路，不是相互调用顺序。</text></svg>