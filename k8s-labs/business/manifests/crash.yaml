apiVersion: v1
kind: Pod
metadata:
  name: collector-crash
  namespace: cec-k8s-practice
  labels: {training: cec-demo}
spec:
  restartPolicy: Always
  activeDeadlineSeconds: 90
  automountServiceAccountToken: false
  containers:
  - name: collector
    image: python:3.12-alpine
    command: [python, -u, -c, 'import sys,time; print("simulated missing collector config",flush=True); time.sleep(2); sys.exit(2)']
    resources:
      requests: {cpu: 50m, memory: 32Mi}
      limits: {cpu: 200m, memory: 64Mi}
