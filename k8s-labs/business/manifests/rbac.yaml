apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitor-config-reader
  namespace: cec-k8s-practice
rules:
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [demo-config]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitor-config-reader
  namespace: cec-k8s-practice
subjects:
- kind: ServiceAccount
  name: cec-demo
  namespace: cec-k8s-practice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitor-config-reader
