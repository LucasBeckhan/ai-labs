apiVersion: v1
kind: Pod
metadata:
  name: archive-reader
  namespace: cec-k8s-practice
  labels: {training: cec-demo}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
  containers:
  - name: reader
    image: python:3.12-alpine
    command: [sleep, "3600"]
    resources:
      requests: {cpu: 20m, memory: 16Mi}
      limits: {cpu: 100m, memory: 32Mi}
    volumeMounts:
    - {name: reports, mountPath: /reports, readOnly: true}
  volumes:
  - name: reports
    persistentVolumeClaim: {claimName: report-data}
