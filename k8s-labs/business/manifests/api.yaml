apiVersion: v1
kind: ServiceAccount
metadata:
  name: cec-demo
  namespace: cec-k8s-practice
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-api
  namespace: cec-k8s-practice
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 60
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: monitor-api}
  template:
    metadata:
      labels: {app: monitor-api, training: cec-demo}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: cec-demo
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: api
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        command: [python, /app/server.py]
        env:
        - {name: RELEASE, value: v1}
        - {name: WARMUP_SECONDS, value: "3"}
        - {name: DEMO_TENANT, value: demo-a}
        - {name: DATA_PATH, value: /data/operations.json}
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - name: ENV_LABEL
          valueFrom:
            configMapKeyRef: {name: demo-config, key: ENV_LABEL}
        ports: [{name: http, containerPort: 8000}]
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 500m, memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        startupProbe:
          httpGet: {path: /startupz, port: http}
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          periodSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - {name: code, mountPath: /app, readOnly: true}
        - {name: config, mountPath: /config, readOnly: true}
        - {name: data, mountPath: /data, readOnly: true}
      volumes:
      - name: code
        configMap: {name: demo-code}
      - name: config
        configMap: {name: demo-config}
      - name: data
        configMap: {name: demo-data}
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-api
  namespace: cec-k8s-practice
spec:
  selector: {app: monitor-api}
  ports: [{name: http, port: 80, targetPort: http}]
