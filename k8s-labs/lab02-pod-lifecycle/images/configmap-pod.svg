<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<rect width="1000" height="620" fill="#f1f5f9"/>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style>
<text x="500" y="40" text-anchor="middle" font-size="25" fill="#0f172a">Lab 02：ConfigMap 如何把代码交给 Pod？</text>
<rect x="50" y="65" width="900" height="75" rx="12" fill="white" stroke="#60a5fa" stroke-width="2"/>
<text x="500" y="94" text-anchor="middle" font-size="22" fill="#1d4ed8">ConfigMap：webapp-code</text>
<text x="500" y="121" text-anchor="middle" font-size="18" fill="#334155">data 中的 server.py 保存了整段 Python 程序</text>
<path d="M500 140 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="50" y="165" width="900" height="75" rx="12" fill="white" stroke="#60a5fa" stroke-width="2"/>
<text x="500" y="194" text-anchor="middle" font-size="22" fill="#1d4ed8">Pod：webapp → volumes</text>
<text x="500" y="221" text-anchor="middle" font-size="18" fill="#334155">定义名为 code 的卷，引用 ConfigMap webapp-code</text>
<path d="M500 240 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="50" y="265" width="900" height="75" rx="12" fill="white" stroke="#60a5fa" stroke-width="2"/>
<text x="500" y="294" text-anchor="middle" font-size="22" fill="#1d4ed8">容器 webapp → volumeMounts</text>
<text x="500" y="321" text-anchor="middle" font-size="18" fill="#334155">把名为 code 的卷挂载到容器内 /app</text>
<path d="M500 340 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="50" y="365" width="900" height="75" rx="12" fill="white" stroke="#60a5fa" stroke-width="2"/>
<text x="500" y="394" text-anchor="middle" font-size="22" fill="#1d4ed8">文件映射：键名 → 文件名</text>
<text x="500" y="421" text-anchor="middle" font-size="18" fill="#334155">server.py → /app/server.py（文件内容就是 Python 代码）</text>
<path d="M500 440 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="50" y="465" width="900" height="75" rx="12" fill="white" stroke="#60a5fa" stroke-width="2"/>
<text x="500" y="494" text-anchor="middle" font-size="22" fill="#1d4ed8">容器启动命令</text>
<text x="500" y="521" text-anchor="middle" font-size="18" fill="#334155">python /app/server.py → 监听 8000 端口，供探针检查</text>
<text x="500" y="590" text-anchor="middle" font-size="18" fill="#475569">python:3.12-alpine 提供 Python 环境；ConfigMap 提供实验程序。</text></svg>