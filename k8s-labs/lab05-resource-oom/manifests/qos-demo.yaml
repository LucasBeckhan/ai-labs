# 三种 QoS 等级各来一个 Pod（都用 sleep 挂着，只为看 qosClass）
# Guaranteed：requests == limits（CPU 和内存都必须相等）
apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits:   {cpu: 100m, memory: 64Mi}
---
# Burstable：设置了 requests/limits 但不完全相等
apiVersion: v1
kind: Pod
metadata:
  name: qos-burstable
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits:   {cpu: 500m, memory: 256Mi}
---
# BestEffort：什么都不设
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
