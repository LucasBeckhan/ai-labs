# 内存吃货：每 0.5 秒多分配 10MB，直到撞墙
apiVersion: v1
kind: ConfigMap
metadata:
  name: hog-code
data:
  hog.py: |
    import time
    data = []
    i = 0
    while True:
        data.append(bytearray(10 * 1024 * 1024))   # 每轮 +10MB
        i += 1
        print(f"allocated {i*10} MB", flush=True)
        time.sleep(0.5)
---
apiVersion: v1
kind: Pod
metadata:
  name: memory-hog
spec:
  restartPolicy: Never          # 只跑一次，方便观察"死透了"的状态
  containers:
  - name: hog
    image: python:3.12-alpine
    command: ["python", "/app/hog.py"]
    volumeMounts: [{name: code, mountPath: /app}]
    resources:
      requests: {memory: 64Mi}
      limits:   {memory: 128Mi}   # 限额 128MB
  volumes:
  - name: code
    configMap: {name: hog-code}
