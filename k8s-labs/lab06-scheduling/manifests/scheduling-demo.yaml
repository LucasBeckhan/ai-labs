# ---- 1. 靠 nodeSelector 调度：只有打了指定 label 的节点才能接住 ----
apiVersion: v1
kind: Pod
metadata:
  name: by-nodeselector
spec:
  nodeSelector:
    workload: batch          # 我们会给节点打这个 label
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
---
# ---- 2. 资源胃口超大：永远找不到能满足的节点 ----
apiVersion: v1
kind: Pod
metadata:
  name: greedy
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {memory: 1Ti}   # kind 节点总共 8GB，1Ti 必然 Pending
---
# ---- 3. 反亲和：不和其他 "p1" Pod 共存（requiredDuringScheduling）----
apiVersion: v1
kind: Pod
metadata:
  name: anti-affinity-1
  labels: {group: ha}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: anti-affinity-2
  labels: {group: ha}
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:   # 硬条件，不满足宁可 Pending
      - labelSelector:
          matchLabels: {group: ha}
        topologyKey: kubernetes.io/hostname   # "拓扑域"=节点
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
