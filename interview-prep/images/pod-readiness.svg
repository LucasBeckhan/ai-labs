<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515">
<rect width="100%" height="100%" fill="#f1f5f9"/>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style>
<text x="500" y="40" text-anchor="middle" font-size="24" fill="#0f172a">Pod 状态：Running ≠ Ready</text>
<rect x="65" y="65" width="870" height="75" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
<text x="500" y="94" text-anchor="middle" font-size="21" fill="#1d4ed8">Pending：等待调度或容器准备</text>
<text x="500" y="121" text-anchor="middle" font-size="17" fill="#334155">已选定节点，也可能仍然处于 Pending</text>
<path d="M500 140 V160 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="65" y="165" width="870" height="75" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
<text x="500" y="194" text-anchor="middle" font-size="21" fill="#1d4ed8">Running：容器已经创建</text>
<text x="500" y="221" text-anchor="middle" font-size="17" fill="#334155">至少一个容器正在运行、启动或重启；不代表服务可用</text>
<path d="M500 240 V260 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="65" y="265" width="870" height="75" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
<text x="500" y="294" text-anchor="middle" font-size="21" fill="#1d4ed8">Ready=False → Ready=True</text>
<text x="500" y="321" text-anchor="middle" font-size="17" fill="#334155">应用预热、就绪检查等条件满足后，才准备好接收流量</text>
<path d="M500 340 V360 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="65" y="365" width="870" height="75" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
<text x="500" y="394" text-anchor="middle" font-size="21" fill="#1d4ed8">Ready 可以再次变为 False</text>
<text x="500" y="421" text-anchor="middle" font-size="17" fill="#334155">例如 readiness 检查失败；Running 和 Ready 是不同维度</text>
</svg>