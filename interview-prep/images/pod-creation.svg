<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="815" viewBox="0 0 1000 815">
<rect width="100%" height="100%" fill="#f1f5f9"/>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style>
<text x="500" y="40" text-anchor="middle" font-size="24" fill="#0f172a">Pod 从创建到运行：谁在做什么？</text>
<rect x="65" y="65" width="870" height="75" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
<text x="500" y="94" text-anchor="middle" font-size="21" fill="#1d4ed8">① kubectl apply → API Server</text>
<text x="500" y="121" text-anchor="middle" font-size="17" fill="#334155">提交 YAML；认证、授权、准入、校验；对象持久化到 etcd</text>
<path d="M500 140 V160 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="65" y="165" width="870" height="75" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
<text x="500" y="194" text-anchor="middle" font-size="21" fill="#1d4ed8">② 创建 Pod 对象</text>
<text x="500" y="221" text-anchor="middle" font-size="17" fill="#334155">Deployment → ReplicaSet → Pod；直接提交 Pod 则跳过控制器链</text>
<path d="M500 240 V260 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="65" y="265" width="870" height="75" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
<text x="500" y="294" text-anchor="middle" font-size="21" fill="#1d4ed8">③ Scheduler 选择节点</text>
<text x="500" y="321" text-anchor="middle" font-size="17" fill="#334155">过滤候选节点 → 打分 → 通过 API Server 绑定节点</text>
<path d="M500 340 V360 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="65" y="365" width="870" height="75" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
<text x="500" y="394" text-anchor="middle" font-size="21" fill="#1d4ed8">④ 目标节点 kubelet 接手</text>
<text x="500" y="421" text-anchor="middle" font-size="17" fill="#334155">读取 Pod 声明，协调容器运行时、网络和存储准备</text>
<path d="M500 440 V460 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="65" y="465" width="870" height="75" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
<text x="500" y="494" text-anchor="middle" font-size="21" fill="#1d4ed8">⑤ 准备运行环境</text>
<text x="500" y="521" text-anchor="middle" font-size="17" fill="#334155">按需准备卷（CSI）；通过 CRI 创建 sandbox，运行时调用 CNI 配网</text>
<path d="M500 540 V560 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="65" y="565" width="870" height="75" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
<text x="500" y="594" text-anchor="middle" font-size="21" fill="#1d4ed8">⑥ 启动容器</text>
<text x="500" y="621" text-anchor="middle" font-size="17" fill="#334155">准备镜像 → 完成普通 init 容器（如有）→ 启动应用容器</text>
<path d="M500 640 V660 m-6 -7 l6 7 6 -7" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="65" y="665" width="870" height="75" rx="12" fill="white" stroke="#93c5fd" stroke-width="2"/>
<text x="500" y="694" text-anchor="middle" font-size="21" fill="#1d4ed8">⑦ 持续上报状态与检查就绪条件</text>
<text x="500" y="721" text-anchor="middle" font-size="17" fill="#334155">kubelet 经 API Server 上报；Ready=True 后可接收匹配 Service 的正常流量</text>
</svg>